[build-system]
requires = ["setuptools>=61.0.0", "wheel", "setuptools-git-versioning<2"]
build-backend = "setuptools.build_meta"

[project]
name = "zigpy-xbee"
dynamic = ["version"]
description = "A library which communicates with XBee radios for zigpy"
urls = {repository = "https://github.com/zigpy/zigpy-xbee"}
authors = [
    {name = "Russell Cloran", email = "rcloran@gmail.com"}
]
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.11"
dependencies = [
    "zigpy>=2.0.0",
]

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*", "tools", "tools.*"]

[project.optional-dependencies]
testing = [
    "pytest>=7.1.2",
    "pytest-asyncio>=0.19.0",
]

[tool.setuptools-git-versioning]
enabled = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "ASYNC", # flake8-async
    "B", # flake8-bugbear
    "C", # complexity
    "D", # pydocstyle
    "E", # pycodestyle
    "F", # pyflakes/autoflake
    "I", # isort
    "SIM", # flake8-simplify
    "UP", # pyupgrade
    "W", # pycodestyle
    "YTT", # flake8-2020
]
ignore = [
    "D202", # No blank lines allowed after function docstring
]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["zigpy_xbee", "tests"]
forced-separate = ["tests"]
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
exclude = ["^tests/"]
# zigpy's integer and struct constructors are unannotated, making nearly every
# zigpy type construction an "untyped call"
untyped_calls_exclude = ["zigpy.types", "zigpy.zdo.types"]

# Autogenerated mypy overrides: start
# Total ignored errors: 141 across 3 modules
[[tool.mypy.overrides]]
module = "zigpy_xbee.uart"
disable_error_code = [
    "arg-type",  # 1
    "no-untyped-call",  # 2
]

[[tool.mypy.overrides]]
module = "zigpy_xbee.api"
disable_error_code = [
    "attr-defined",  # 2
    "no-untyped-call",  # 12
    "no-untyped-def",  # 24
    "type-arg",  # 1
    "union-attr",  # 8
    "unreachable",  # 2
    "var-annotated",  # 1
]

[[tool.mypy.overrides]]
module = "zigpy_xbee.zigbee.application"
disable_error_code = [
    "arg-type",  # 5
    "assignment",  # 9
    "misc",  # 4
    "no-untyped-call",  # 5
    "no-untyped-def",  # 13
    "override",  # 1
    "union-attr",  # 50
    "var-annotated",  # 1
]
# Autogenerated mypy overrides: end

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
